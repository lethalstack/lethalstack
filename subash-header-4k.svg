<svg xmlns="http://www.w3.org/2000/svg" width="3840" height="1080" viewBox="0 0 3840 1080" role="img" aria-labelledby="title desc">
<title id="title">Subash — Software Developer</title>
<desc id="desc">A clean dark GitHub-inspired animated profile header with white and gray typography, a restrained GitHub-green accent, and a subtle orbital particle network.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0d1117"/>
    <stop offset="0.55" stop-color="#080b10"/>
    <stop offset="1" stop-color="#0d1117"/>
  </linearGradient>
  <radialGradient id="orbGlow">
    <stop offset="0" stop-color="#3fb950" stop-opacity=".14"/>
    <stop offset="1" stop-color="#3fb950" stop-opacity="0"/>
  </radialGradient>
  <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse">
    <path d="M72 0H0V72" fill="none" stroke="#30363d" stroke-opacity=".28" stroke-width="1.5"/>
  </pattern>
  <linearGradient id="orbStroke" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#8b949e" stop-opacity=".12"/>
    <stop offset=".48" stop-color="#c9d1d9" stop-opacity=".8"/>
    <stop offset=".75" stop-color="#3fb950" stop-opacity=".9"/>
    <stop offset="1" stop-color="#8b949e" stop-opacity=".12"/>
  </linearGradient>
  <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="10"/>
  </filter>
  <clipPath id="frameClip"><rect x="20" y="20" width="3800" height="1040" rx="34"/></clipPath>
</defs>
<rect width="3840" height="1080" rx="36" fill="url(#bg)"/>
<g clip-path="url(#frameClip)">
  <rect width="3840" height="1080" fill="url(#grid)"/>
  <circle cx="2920" cy="530" r="750" fill="url(#orbGlow)"/>
  <path d="M0 840H3840" stroke="#30363d" stroke-opacity=".5" stroke-width="2"/>
  <path d="M2200 0V1080M2540 0V1080M2880 0V1080M3220 0V1080M3560 0V1080" stroke="#30363d" stroke-opacity=".26" stroke-width="2"/>
  <!-- Right-side orbital system -->
  <g transform="translate(2910 520)">
    <ellipse rx="680" ry="350" transform="rotate(-26)" fill="none" stroke="#8b949e" stroke-opacity=".23" stroke-width="3"/>
    <ellipse rx="530" ry="280" transform="rotate(32)" fill="none" stroke="#8b949e" stroke-opacity=".2" stroke-width="3"/>
    <ellipse rx="410" ry="520" transform="rotate(56)" fill="none" stroke="#8b949e" stroke-opacity=".16" stroke-width="3"/>
    <path d="M-720 200 C-410 -60 -140 250 140 -20 S500 -250 720 -100" fill="none" stroke="#3fb950" stroke-opacity=".35" stroke-width="3" stroke-dasharray="8 20">
      <animate attributeName="stroke-dashoffset" values="0;-112" dur="7s" repeatCount="indefinite"/>
    </path>
    <g fill="#c9d1d9">
      <circle cx="-530" cy="-105" r="5"/><circle cx="-280" cy="205" r="6"/>
      <circle cx="20" cy="-260" r="5"/><circle cx="315" cy="115" r="6"/>
      <circle cx="510" cy="-170" r="5"/><circle cx="170" cy="285" r="4"/>
    </g>
    <g fill="#3fb950">
      <circle cx="-530" cy="-105" r="16" opacity=".18" filter="url(#softGlow)"/>
      <circle cx="-530" cy="-105" r="7"/>
      <circle cx="315" cy="115" r="18" opacity=".2" filter="url(#softGlow)"/>
      <circle cx="315" cy="115" r="7"/>
    </g>
    <circle r="225" fill="none" stroke="#30363d" stroke-width="2" stroke-dasharray="2 22">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="70s" repeatCount="indefinite"/>
    </circle>
  </g>
  <!-- Decorative data lines -->
  <g stroke="#8b949e" stroke-opacity=".45" stroke-width="2">
    <path d="M2220 180H2630"/><path d="M3200 840H3680"/>
    <path d="M2390 900H2690"/><path d="M3370 210H3680"/>
  </g>
  <g fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="26" letter-spacing="6">
    <text x="2220" y="155">SYSTEMS / 01</text>
    <text x="3200" y="810">IDEAS → EXECUTION</text>
  </g>
  <circle cx="2630" cy="180" r="6" fill="#3fb950"/>
  <circle cx="3680" cy="840" r="6" fill="#3fb950"/>
</g>
<rect x="20" y="20" width="3800" height="1040" rx="34" fill="none" stroke="#30363d" stroke-width="3"/>
<!-- Text area -->
<g font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
  <g fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="30" letter-spacing="8">
    <text x="190" y="190">SOFTWARE DEVELOPER</text>
    <text x="3650" y="190" text-anchor="end">BUILD / LEARN / REPEAT</text>
  </g>
  <path d="M190 228H440" stroke="#3fb950" stroke-width="8" stroke-linecap="round"/>
  <text x="180" y="515" fill="#f0f6fc" font-size="250" font-weight="750" letter-spacing="-8">Subash</text>
  <rect x="1055" y="320" width="14" height="220" rx="7" fill="#3fb950">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.42;0.48;0.9;1" dur="1.4s" repeatCount="indefinite"/>
  </rect>
  <text x="195" y="640" fill="#c9d1d9" font-size="56" font-weight="450" letter-spacing="16">SOFTWARE DEVELOPER</text>
  <text x="195" y="730" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="34" letter-spacing="9">CODE.  DESIGN.  LEARN.  IMPROVE.</text>
  <path d="M195 800H1020" stroke="#30363d" stroke-width="3"/>
  <path d="M195 800H195" stroke="#3fb950" stroke-width="6" stroke-linecap="round">
    <animate attributeName="d" values="M195 800H195;M195 800H1020;M195 800H195" dur="4.8s" repeatCount="indefinite"/>
  </path>
  <g fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="25" letter-spacing="6">
    <text x="195" y="925">FOCUS ON THE DETAILS.</text>
    <text x="3650" y="1000" text-anchor="end">[ CONTINUOUS IMPROVEMENT ]</text>
  </g>
</g>
<!-- Strong but restrained entrance -->
<rect x="0" y="0" width="3840" height="1080" fill="#0d1117" opacity="1">
  <animate attributeName="opacity" values="1;1;0" keyTimes="0;0.08;1" dur="1.1s" fill="freeze"/>
</rect>
</svg>