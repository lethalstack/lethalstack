name: Update profile assets
on:
  schedule: [{cron: "0 3 * * *"}]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pillow numpy && sudo apt-get install -y fonts-liberation >/dev/null
      - run: python tools/make_profile.py --user "${{ github.repository_owner }}"
        env: {GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
      - run: |
          git config user.name "github-actions"; git config user.email "actions@users.noreply.github.com"
          git add assets README.md; git diff --cached --quiet || git commit -m "Update profile data" && git push
